<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AA Mini Browser</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar {
      display: flex; gap: 6px; padding: 8px;
      background: #f0f0f0; border-bottom: 1px solid #ccc;
    }
    #bar button {
      padding: 6px 12px; cursor: pointer; border: 1px solid #bbb;
      background: #fff; border-radius: 4px;
    }
    #bar button:hover { background: #e8e8e8; }
    #url {
      flex: 1; padding: 6px 8px; font-size: 13px;
      border: 1px solid #bbb; border-radius: 4px;
    }
    #status {
      padding: 4px 8px; font-size: 12px; color: #c00;
      background: #fff5f5; min-height: 16px; display: none;
    }
    #status.show { display: block; }
    #view { flex: 1; border: none; width: 100%; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="back" title="Back">&#9664;</button>
    <button id="reload" title="Reload">&#8635;</button>
    <input id="url" type="text"
           placeholder="Paste consent-journey URL (e.g. http://localhost:3000/?orgId=...&ecreq=...)" />
    <button id="go">Go</button>
  </div>
  <div id="status"></div>
  <webview id="view"
           allowpopups
           webpreferences="webSecurity=no, allowRunningInsecureContent=yes, contextIsolation=no">
  </webview>
  <script src="renderer.js"></script>
</body>
</html>
